        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
        .studio-grid { display: grid; grid-template-columns: 450px 1fr; gap: 25px; max-width: 1600px; margin: 0 auto; }
        .sidebar { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; height: calc(100vh - 80px); overflow-y: auto; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 20px; }
        .tab-nav { display: flex; flex-direction: column; gap: 10px; }
        .tab-btn { padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: #21262d; color: var(--text); cursor: pointer; text-align: left; font-weight: bold; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--p); color: white; border-color: var(--p); box-shadow: 0 4px 15px rgba(255, 76, 76, 0.3); }
        .group { background: #1c2128; padding: 18px; border-radius: 10px; border: 1px solid var(--border); }
        .group-title { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; font-weight: 800; }
        .setting-item { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #fff; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; background: var(--input); border: 1px solid #444; border-radius: 6px; padding: 12px; color: white; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; }
        .action-btn { width: 100%; padding: 18px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        .action-btn:disabled { background: #444; cursor: not-allowed; opacity: 0.7; }
        .display { background: #000; border: 1px solid var(--border); border-radius: 12px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .loader { display: none; width: 60px; height: 60px; border: 5px solid #333; border-top-color: var(--p); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #media-render { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #media-render img, #media-render video { max-width: 95%; max-height: 85vh; border-radius: 8px; }
        .status-bar { padding: 15px; font-size: 14px; color: #f1c40f; text-align: center; background: #1c2128; border: 1px solid var(--border); border-radius: 8px; margin-top: 15px; font-family: monospace; }
        .check-item { display: flex; align-items: center; gap: 10px; color: white; font-size: 14px; margin-top: 5px; }
        .check-item input { width: 18px; height: 18px; cursor: pointer; }
        #upload-group.hidden { display: none; }
