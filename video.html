<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom The AI Plus | Next-Gen Generation</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js"></script>
    <style>
        :root { 
            --primary: #ff3b3b; 
            --bg: #05070a; 
            --card: #0d1117; 
            --text: #c9d1d9; 
            --header: #ffffff; 
            --input-bg: #161b22; 
            --border: #30363d;
            --accent: #ff7b7b;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        .container { max-width: 1200px; width: 100%; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--header); margin: 0; font-size: 2.5rem; letter-spacing: -1px; }
        .badge { background: var(--primary); color: white; padding: 2px 10px; border-radius: 4px; font-size: 0.7rem; vertical-align: middle; margin-left: 10px; }

        .tabs { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 10px; margin-bottom: 25px; background: var(--card);
            padding: 5px; border-radius: 12px; border: 1px solid var(--border);
        }
        .tab { 
            padding: 12px; text-align: center; cursor: pointer; 
            border-radius: 8px; font-weight: 600; transition: 0.2s; font-size: 0.9rem;
        }
        .tab.active { background: var(--primary); color: white; }

        .grid { display: grid; grid-template-columns: 420px 1fr; gap: 20px; }
        @media (max-width: 950px) { .grid { grid-template-columns: 1fr; } }

        .card { 
            background: var(--card); border: 1px solid var(--border); 
            padding: 24px; border-radius: 16px; height: fit-content;
        }

        label { display: block; margin: 15px 0 6px; font-size: 0.85rem; font-weight: 600; color: #8b949e; }
        textarea, input, select { 
            width: 100%; background: var(--input-bg); border: 1px solid var(--border); 
            border-radius: 8px; padding: 12px; color: white; box-sizing: border-box; 
        }

        .btn-gen { 
            width: 100%; padding: 16px; margin-top: 20px; background: var(--primary); 
            color: white; border: none; border-radius: 10px; font-size: 1rem; 
            font-weight: 800; cursor: pointer; text-transform: uppercase;
        }
        .btn-gen:disabled { background: #30363d; cursor: not-allowed; }

        #output-container { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-height: 500px; background: #010409; 
            border-radius: 16px; border: 1px solid var(--border);
        }

        .loader { 
            display: none; width: 50px; height: 50px; 
            border: 4px solid #161b22; border-top: 4px solid var(--primary); 
            border-radius: 50%; animation: spin 1s linear infinite; 
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        video, img { max-width: 100%; border-radius: 12px; max-height: 70vh; }
        .download-btn { background: #238636 !important; display: none; margin-top: 15px; }

        .shield-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--primary);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; font-weight: bold; font-size: 2rem;
        }
    </style>
</head>
<body>

<div id="shield" class="shield-overlay">ACCESS RESTRICTED</div>

<div class="container">
    <header>
        <h1>TOM THE AI<span class="badge">Plus</span></h1>
        <p style="color: #8b949e;">Multi-Tool Generation Suite</p>
    </header>

    <div class="tabs">
        <div id="tab-t2i" class="tab active" onclick="setMode('t2i')">Text-to-Image</div>
        <div id="tab-edit" class="tab" onclick="setMode('edit')">Editor Tools</div>
        <div id="tab-t2v" class="tab" onclick="setMode('t2v')">Text-to-Video</div>
        <div id="tab-i2v" class="tab" onclick="setMode('i2v')">Image-to-Video</div>
    </div>

    <div class="grid">
        <div class="card">
            <div id="upload-area" style="display:none;">
                <label>Upload Source Image</label>
                <input type="file" id="file_input" accept="image/*">
            </div>

            <div id="editor-tools" style="display:none;">
                <label>Select Tool</label>
                <select id="edit_tool">
                    <option value="edit">Magic Edit (Prompt-based)</option>
                    <option value="upscale">Super-Resolution Upscale</option>
                    <option value="watermark">Remove Watermark</option>
                </select>
            </div>

            <div id="prompt-area">
                <label>Prompt</label>
                <textarea id="prompt" rows="4" placeholder="Enter your instructions..."></textarea>
            </div>

            <div id="video-settings" style="display:none;">
                <label>Video Resolution</label>
                <select id="vid_res">
                    <option value="1280*720">1280x720 (HD)</option>
                    <option value="720*1280">720x1280 (Vertical)</option>
                </select>
            </div>

            <button class="btn-gen" id="genBtn">Generate</button>
        </div>

        <div class="card" id="output-container">
            <div class="loader" id="loader"></div>
            <div id="media-out"></div>
            <button class="btn-gen download-btn" id="dlBtn">📥 Download File</button>
            <div id="status" style="margin-top:20px; font-size:0.9rem; color:var(--accent);">Ready</div>
        </div>
    </div>
</div>

<script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

    // --- Nexus Shield ---
    const s = document.getElementById('shield');
    window.addEventListener('blur', () => s.style.display = 'flex');
    window.addEventListener('focus', () => s.style.display = 'none');
    setInterval(() => { Function('debugger')(); }, 500);

    let mode = 't2i';
    const btn = document.getElementById('genBtn');
    const dlBtn = document.getElementById('dlBtn');
    const status = document.getElementById('status');
    const loader = document.getElementById('loader');
    const mediaOut = document.getElementById('media-out');

    window.setMode = (m) => {
        mode = m;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${m}`).classList.add('active');
        
        document.getElementById('upload-area').style.display = (m === 'edit' || m === 'i2v') ? 'block' : 'none';
        document.getElementById('editor-tools').style.display = (m === 'edit') ? 'block' : 'none';
        document.getElementById('prompt-area').style.display = (m !== 'edit' || document.getElementById('edit_tool').value === 'edit') ? 'block' : 'none';
        document.getElementById('video-settings').style.display = (m === 't2v') ? 'block' : 'none';
        
        mediaOut.innerHTML = "";
        dlBtn.style.display = "none";
        status.innerText = `Mode: ${m.toUpperCase()}`;
    };

    // Editor tool change logic
    document.getElementById('edit_tool').onchange = (e) => {
        document.getElementById('prompt-area').style.display = (e.target.value === 'edit') ? 'block' : 'none';
    };

    btn.onclick = async () => {
        const prompt = document.getElementById('prompt').value;
        const file = document.getElementById('file_input').files[0];
        const seed = Math.floor(Math.random() * 2147483647); // Positive seed fix

        if ((mode === 'edit' || mode === 'i2v') && !file) return alert("Please upload an image!");

        btn.disabled = true;
        loader.style.display = "block";
        dlBtn.style.display = "none";
        mediaOut.innerHTML = "";
        status.innerText = "Initializing Pipeline...";

        try {
            if (mode === 't2i') {
                const client = await Client.connect("luca115/wan2-2-14b-fast-t2i");
                const res = await client.predict("/generate_image", [prompt, "blurry, low quality", 1, 3, 12, seed, false]);
                render(res.data[0], 'img');
            } 
            
            else if (mode === 'edit') {
                const client = await Client.connect("selfit-camera/Omni-Image-Editor");
                const tool = document.getElementById('edit_tool').value;
                let res;
                
                if (tool === 'edit') res = await client.predict("/edit_image_interface", [file, prompt]);
                else if (tool === 'upscale') res = await client.predict("/image_upscale_interface", [file]);
                else if (tool === 'watermark') res = await client.predict("/watermark_removal_interface", [file, true]);
                
                render(res.data[0], 'img');
            }

            else if (mode === 't2v' || mode === 'i2v') {
                const client = await Client.connect("Wan-AI/Wan2.1");
                const endpoint = mode === 't2v' ? "/t2v_generation_async" : "/i2v_generation_async";
                const pollPath = mode === 't2v' ? "/status_refresh" : "/status_refresh_1";
                const params = mode === 't2v' ? [prompt, document.getElementById('vid_res').value, false, seed] : [prompt, file, false, seed];

                await client.predict(endpoint, params);
                
                const poll = async () => {
                    const check = await client.predict(pollPath, []);
                    const videoUrl = check.data[0]?.url || check.data[0];
                    if (videoUrl && typeof videoUrl === 'string') {
                        render(videoUrl, 'video');
                    } else {
                        status.innerText = "Generating Video... (approx 30s left)";
                        setTimeout(poll, 4000);
                    }
                };
                poll();
            }
        } catch (e) {
            status.innerText = "Error: " + e.message;
            loader.style.display = "none";
            btn.disabled = false;
        }
    };

    function render(url, type) {
        if (!url) return;
        loader.style.display = "none";
        btn.disabled = false;
        status.innerText = "Success!";

        if (url.includes('<img')) {
            mediaOut.innerHTML = url;
            const src = url.match(/src="([^"]+)"/)[1];
            setupDownload(src, 'png');
        } else {
            mediaOut.innerHTML = type === 'video' 
                ? `<video src="${url}" controls autoplay loop></video>` 
                : `<img src="${url}">`;
            setupDownload(url, type === 'video' ? 'mp4' : 'png');
        }
    }

    function setupDownload(url, ext) {
        dlBtn.style.display = "block";
        dlBtn.onclick = async () => {
            const res = await fetch(url);
            const blob = await res.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `TomAI_Plus_${Date.now()}.${ext}`;
            link.click();
        };
    }
</script>
</body>
</html>
