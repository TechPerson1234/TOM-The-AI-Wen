:root {
    --primary: #00f2ff;
    --secondary: #bd00ff;
    --accent: #ff0055;
    --bg-deep: #030305;
    --glass: rgba(20, 20, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #8899a6;
    --font-main: 'Outfit', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
    --sat: env(safe-area-inset-top);
    --sab: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body, html {
    margin: 0; padding: 0;
    height: 100vh; height: 100dvh; width: 100vw;
    font-family: var(--font-main);
    background-color: var(--bg-deep);
    color: var(--text-main);
    overflow: hidden;
    position: fixed;
}

.ambient-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 15% 50%, rgba(189, 0, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.15), transparent 40%);
    z-index: -1;
}

/* CUSTOM MODAL STYLES */
#nexusModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    display: none; align-items: center; justify-content: center;
    z-index: 9999; animation: fadeIn 0.2s ease;
}

.modal-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 30px; border-radius: 24px;
    max-width: 350px; width: 90%; text-align: center;
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
}

.modal-header {
    color: var(--accent); font-weight: 700; font-size: 0.8rem;
    letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase;
}

.modal-card p { font-size: 0.95rem; color: var(--text-main); margin-bottom: 25px; line-height: 1.5; opacity: 0.8; }

.modal-btns { display: flex; gap: 12px; }

.m-btn {
    flex: 1; padding: 12px; border-radius: 12px; border: none;
    font-family: var(--font-main); font-weight: 700; font-size: 0.8rem; cursor: pointer;
    transition: transform 0.2s;
}
.m-btn:active { transform: scale(0.95); }

.m-cancel { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border); }
.m-confirm { background: var(--accent); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }

/* EXISTING UI STYLES */
.interface-grid {
    display: grid; grid-template-rows: auto 1fr auto;
    height: 100%; max-width: 1200px; margin: 0 auto;
    padding: max(15px, var(--sat)) 20px 0 20px; gap: 15px; position: relative;
}

.hud-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: var(--glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-radius: 20px; z-index: 10;
}

.brand { font-weight: 700; letter-spacing: 1px; font-size: 1.1rem; color: #fff; }

.mode-switcher { display: flex; background: rgba(0,0,0,0.3); border-radius: 100px; padding: 3px; border: 1px solid var(--glass-border); }

.mode-btn {
    background: transparent; border: none; color: var(--text-muted);
    padding: 6px 14px; font-size: 0.75rem; font-weight: 600;
    border-radius: 100px; cursor: pointer; transition: 0.3s;
}
.mode-btn.active { background: var(--primary); color: #000; }

.clear-btn {
    background: rgba(255, 0, 85, 0.1); color: var(--accent);
    border: 1px solid rgba(255, 0, 85, 0.2); padding: 6px 12px;
    font-size: 0.7rem; font-weight: 700; border-radius: 100px; cursor: pointer;
}

#chat-log {
    background: rgba(10, 10, 14, 0.3); border-radius: 20px;
    padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 20px;
}

.msg { max-width: 85%; line-height: 1.6; font-size: 0.95rem; animation: fadeIn 0.3s ease-out; word-wrap: break-word; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.ai { align-self: flex-start; color: #eee; padding-left: 15px; border-left: 2px solid var(--primary); }
.user { align-self: flex-end; background: linear-gradient(135deg, var(--secondary), #8f00ff); color: #fff; padding: 12px 18px; border-radius: 18px 18px 4px 18px; }

#media-preview-deck {
    display: none; background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--primary); border-radius: 16px; padding: 10px; margin-bottom: 5px; align-items: center; gap: 15px;
}
#media-preview-deck.active { display: flex; }

.preview-thumb { height: 50px; width: 50px; object-fit: cover; border-radius: 8px; background: #000; }

.analyze-btn { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

.input-dock { padding-bottom: max(20px, var(--sab)); display: flex; gap: 10px; align-items: center; }

.input-capsule {
    flex: 1; display: flex; align-items: center; background: var(--glass);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--glass-border); border-radius: 100px; padding: 5px 5px 5px 20px;
}

#userInput { flex: 1; background: transparent; border: none; color: #fff; font-family: var(--font-main); font-size: 16px; outline: none; }

.send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--primary); color: #000; cursor: pointer; }

.attach-btn {
    width: 44px; height: 44px; border-radius: 50%; background: var(--glass);
    color: var(--primary); border: 1px solid var(--glass-border); cursor: pointer; font-size: 1.2rem;
}

.source-link { display: block; font-size: 0.7rem; color: var(--primary); margin-top: 5px; text-decoration: none; opacity: 0.8; }
</style>
