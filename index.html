<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom The AI | math12393 </title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
       
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212; /* Sleek dark theme */
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        
        #loader-container {
            text-align: center;
            transition: opacity 0.5s ease-out;
            z-index: 10;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top: 6px solid #3498db; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

   
        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

 
    <div id="loader-container">
        <div class="spinner"></div>
        <h1>Tom The AI</h1>
        <p>Initializing systems...</p>
    </div>

  
    <div id="main-content">
       
        <iframe 
            src="Main.html" 
            id="ai-frame" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; microphone;" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('ai-frame');
        const loader = document.getElementById('loader-container');
        const content = document.getElementById('main-content');

        
        iframe.onload = function() {
           
            setTimeout(() => {
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    content.style.display = 'block';
                }, 500);
            }, 1000); 
        };

     
        window.addEventListener('load', function() {
            setTimeout(() => {
                if (content.style.display !== 'block') {
                    loader.style.display = 'none';
                    content.style.display = 'block';
                }
            }, 5000); 
        });
    </script>
</body>
</html>
